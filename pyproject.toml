[project]
name = "mini-claude-code"
version = "0.2.0"
description = "Mini Claude Code v2: a planning, execution, reflection coding agent built with LangGraph, OpenAI-compatible APIs, Typer, Rich, and Pydantic."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "langgraph>=0.2.60",
  "openai>=1.59.0",
  "pydantic>=2.7.0",
  "rich>=13.7.0",
  "typer>=0.12.0",
]

[project.scripts]
cc = "mini_cc.cli:entrypoint"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mini_cc"]
